version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguard_web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist the database file (if using SQLite)
      - sqlite_data:/app/instance
      # Persist static PDF reports
      - report_data:/app/app/static/reports
      # Persist system and platform activity logs
      - log_data:/app/logs
      # Share static assets with Nginx
      - static_data:/app/app/static
    expose:
      - "8000"
    networks:
      - cyberguard_net

  nginx:
    image: nginx:alpine
    container_name: cyberguard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Map reverse proxy configuration
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Map static assets from web container to serve them directly
      - static_data:/app/app/static:ro
      # Map static PDF reports directory to serve them directly
      - report_data:/app/app/static/reports:ro
    depends_on:
      - web
    networks:
      - cyberguard_net

volumes:
  sqlite_data:
  report_data:
  log_data:
  static_data:

networks:
  cyberguard_net:
    driver: bridge
