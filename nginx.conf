# Nginx Server Configuration for CyberGuard AI

server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP requests to HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # Security Headers (Nginx side redundancy/reinforcement)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; frame-ancestors 'none';" always;

    # Maximum payload upload limit (Matches Flask MAX_CONTENT_LENGTH of 5MB)
    client_max_body_size 5M;

    # Static assets serving (Optimization: bypass Gunicorn for static assets)
    location /static/ {
        alias /app/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy connections to Gunicorn app server
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Buffer settings for proxying
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        
        # Timeout settings
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}

